<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PegChart example</title>
  <style>
    body { font: 14px system-ui, sans-serif; margin: 24px; color: #24292f; }
    .btn-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    button { padding: 7px 12px; cursor: pointer; }
    .peg-chart { max-width: 100%; height: auto; overflow: visible; }
    .x-axis, .y-axis { font: 12px sans-serif; }
    .category-band { pointer-events: none; }
    .activity-bar { stroke: #34495e; stroke-width: .5px; cursor: grab; }
    .is-dragging .activity-bar { cursor: grabbing; opacity: .8; }
    .activity-label { pointer-events: none; }
    .resize-handle { fill: #4a235a; cursor: ew-resize; }
  </style>
</head>
<body>
  <h1>Interactive project timeline</h1>
  <div class="btn-group">
    <div id="emptybtn"></div><div id="deletebtn"></div><div id="newbtn"></div><div id="savebtn"></div>
  </div>
  <div id="myPlot"></div>
  <script src="https://d3js.org/d3.v6.min.js"></script>
  <script src="../src/d3-v6-compat.js"></script>
  <script src="../src/dateformv2.js"></script>
  <script src="../src/pegChart.js"></script>
  <script src="rndata.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      function isValidActivityData(value) {
        if (!Array.isArray(value)) return false;

        return value.every(function (item) {
          if (!item || typeof item !== "object") return false;
          if (!item.start || !item.finish) return false;

          var start = item.start instanceof Date ? item.start : new Date(item.start);
          var finish = item.finish instanceof Date ? item.finish : new Date(item.finish);

          return !isNaN(start.getTime()) &&
                 !isNaN(finish.getTime()) &&
                 finish >= start;
        });
      }

      var saved = null;
      try {
        var parsed = JSON.parse(localStorage.getItem("myData") || "null");
        if (isValidActivityData(parsed)) saved = parsed;
      } catch (error) {
        saved = null;
      }

      var chartData = saved || getRandomData();
      var chart = pegChart().leftMargin(150).width(1100);

      try {
        chart(document.getElementById("myPlot"), chartData);
      } catch (error) {
        localStorage.removeItem("myData");
        chart(document.getElementById("myPlot"), getRandomData());
      }
    });
  </script>
</body>
</html>
